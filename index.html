<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>照片配對遊戲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-touch-callout: none; }
  img { -webkit-user-drag: none; pointer-events: none; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: linear-gradient(135deg, #fdf6e3, #e8f5e9);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 { color: #2e7d32; margin-bottom: 8px; font-size: 40px; }
  .status-bar {
    display: flex;
    gap: 24px;
    background: #fff;
    padding: 10px 24px;
    border-radius: 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    margin-bottom: 24px;
    font-size: 16px;
  }
  .status-bar .item { display: flex; align-items: center; gap: 6px; }
  .status-bar .label { color: #777; }
  .status-bar .value { font-weight: bold; color: #2e7d32; min-width: 30px; }
  .boards {
    display: flex;
    gap: 40px;
    width: 100%;
    max-width: 1000px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .board { flex: 1; min-width: 320px; max-width: 460px; }
  .board h2 {
    text-align: center;
    color: #555;
    margin-bottom: 12px;
    font-size: 18px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
  }
  .card {
    aspect-ratio: 1;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    position: relative;
  }
  .card:hover:not(.locked):not(.selected) { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(0,0,0,.2); }
  .card:active:not(.locked) { transform: scale(.95); }
  .card.word-card {
    background: #fff;
    border: 3px solid #ddd;
    font-size: 22px;
    font-weight: bold;
    color: #333;
  }
  .card.photo-card {
    border: 3px solid #ddd;
    overflow: hidden;
  }
  .card.photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card.selected {
    border-color: #ff9800;
    box-shadow: 0 0 0 3px #ffe0b2;
    transform: scale(1.04);
  }
  .card.matched { border-color: #4caf50; background: #c8e6c9; }
  .card.matched img { opacity: .85; }
  .card.word-card.matched { color: #2e7d32; }
  .card.matched::after {
    content: "✓";
    position: absolute;
    top: 6px; right: 10px;
    color: #4caf50;
    font-size: 20px;
    font-weight: bold;
  }
  .card.locked { cursor: default; }
  .card.locked:not(.matched) { opacity: .5; }
  .card.wrong { animation: shake .4s; border-color: #f44336 !important; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .result-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .result-panel.show { display: flex; }
  .result-box {
    background: #eef5e7;
    border-radius: 16px;
    padding: 32px 44px 36px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
  }
  .result-box h2 { color: #2e7d32; margin-bottom: 6px; font-size: 30px; letter-spacing: 2px; }
  .result-box.fail h2 { color: #c62828; }
  .result-box .fail-msg { color: #c62828; font-size: 15px; margin-bottom: 14px; }
  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin: 18px 0 6px;
    flex-wrap: wrap;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: #fff;
    border-radius: 10px;
    padding: 10px 18px;
    min-width: 96px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .stat .label { font-size: 13px; color: #888; }
  .stat .value { font-size: 22px; font-weight: bold; color: #2e7d32; }
  .result-box.fail .stat .value { color: #c62828; }
  .intro-section { margin-top: 20px; padding-top: 16px; border-top: 1px dashed #c5d9b0; }
  .intro-section h3 { font-size: 17px; color: #4a7a3a; margin-bottom: 14px; letter-spacing: 1px; }
  .intro-grid { display: flex; gap: 14px; justify-content: center; align-items: stretch; flex-wrap: wrap; }
  .intro-card {
    width: 180px;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 12px 12px 14px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .intro-card img {
    width: 92px;
    height: 92px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
  }
  .intro-card .name { font-size: 16px; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px; }
  .intro-card:nth-child(1) .name { color: #7cb342; }
  .intro-card:nth-child(2) .name { color: #2e7d32; }
  .intro-card:nth-child(3) .name { color: #14521a; }
  .intro-card .desc {
    font-size: 13px;
    color: #555;
    line-height: 1.55;
    text-align: left;
    width: 100%;
  }
  .intro-card .desc > div { margin-bottom: 3px; }
  .intro-card .desc .gray { font-size: 8px; color: #999; }
  .intro-card .desc .big { font-size: 15px; }
  .intro-card .desc .gray .big { font-size: 10px; }
  #restartBtn {
    margin-top: 24px;
    padding: 12px 32px;
    font-size: 18px;
    background: #2e7d32;
    color: #fff;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: background .2s;
  }
  #restartBtn:hover { background: #1b5e20; }
  .footnote { margin-top: 14px; font-size: 12px; color: #9aa88e; }
  @media (max-width: 720px) {
    body { padding: 12px 10px; }
    h1 { font-size: 32px; }
    .boards { flex-direction: column; align-items: center; gap: 20px; }
    .board { max-width: 440px; width: 100%; min-width: 0; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .status-bar { flex-wrap: wrap; justify-content: center; gap: 6px 18px; padding: 8px 14px; font-size: 14px; }
    .result-box { padding: 24px 18px 26px; }
    .stats { gap: 8px; }
    .stat { min-width: 72px; padding: 8px 10px; }
    .stat .value { font-size: 18px; }
    .intro-card { width: 30%; min-width: 108px; }
    .intro-card img { width: 72px; height: 72px; }
    .intro-card .desc { font-size: 12px; }
    .intro-card .desc .big { font-size: 14px; }
.intro-card .desc .gray { font-size: 7px; }
    .intro-card .desc .gray .big { font-size: 9px; }
  }
  .hint { color: #888; margin-bottom: 16px; font-size: 14px; }
</style>
</head>
<body>
<h1>專章配對遊戲</h1>
<p class="hint">可以「先點詞、再點照片」,也可以「先點照片、再點詞」;失誤超過 3 次即失敗!</p>
<div class="status-bar">
  <div class="item"><span class="label">已配對:</span><span class="value" id="matchedCount">0</span><span class="label">/7</span></div>
  <div class="item"><span class="label">嘗試:</span><span class="value" id="attempts">0</span></div>
  <div class="item"><span class="label">失誤:</span><span class="value" id="mistakes">0</span></div>
  <div class="item"><span class="label">剩餘機會:</span><span class="value" id="lives">3</span></div>
  <div class="item"><span class="label">時間:</span><span class="value" id="timer">00:00</span></div>
</div>
<div class="boards">
  <div class="board">
    <h2>詞語</h2>
    <div class="grid" id="wordBoard"></div>
  </div>
  <div class="board">
    <h2>照片</h2>
    <div class="grid" id="photoBoard"></div>
  </div>
</div>
<div class="result-panel" id="resultPanel">
  <div class="result-box" id="resultBox">
    <h2 id="resultTitle">恭喜過關!</h2>
    <div class="fail-msg" id="failMsg" style="display:none">失誤已達 3 次,再加油!</div>
    <div class="stats">
      <div class="stat"><span class="label">用時</span><span class="value" id="rTime">00:00</span></div>
      <div class="stat"><span class="label">嘗試次數</span><span class="value" id="rAttempts">0</span></div>
      <div class="stat"><span class="label">失誤次數</span><span class="value" id="rMistakes">0</span></div>
    </div>
    <div class="intro-section">
      <h3>專章小知識</h3>
      <div class="intro-grid" id="introGrid"></div>
    </div>
    <button id="restartBtn">再玩一次</button>
    <p class="footnote">(怎麼網上專章的圖片都是遠古畫質...)</p>
  </div>
</div>

  "工藝章": "編織 烹飪 花藝 園藝 木工 陶瓷 黏土 一堆有趣的項目\n(藝術)",
  "遠足章": "遠足\n理論+實習+考核(5小時)",

  "運動員章": "一堆運動項目\n乒乓球，羽毛球，籃球，閃避球，足球等等\n(有趣，通常幾個一起開幾個運動項目)",

let selected = null; // { type: 'word'|'photo', key, card }
let matched = new Set();
let attempts = 0, mistakes = 0;
let gameOver = false;
let timerInterval = null, startTime = null, timerRunning = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  startTime = Date.now();
  timerInterval = setInterval(() => {
    document.getElementById("timer").textContent = formatTime(Date.now() - startTime);
  }, 200);
}

function updateStats() {
  document.getElementById("matchedCount").textContent = matched.size;
  document.getElementById("attempts").textContent = attempts;
  document.getElementById("mistakes").textContent = mistakes;
  document.getElementById("lives").textContent = MAX_MISTAKES - mistakes;
  document.getElementById("lives").style.color = (MAX_MISTAKES - mistakes <= 1) ? "#c62828" : "#2e7d32";
}

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerRunning = false;
}

function renderIntroLine(container, line) {
  const isGray = /^\(.+\)$/.test(line.trim());
  const el = document.createElement("div");
  let text = line;
  if (isGray) {
    el.className = "gray";
  }
  const parts = text.split("'");
  parts.forEach((p, i) => {
    if (i % 2 === 1) {
      const b = document.createElement("span");
      b.className = "big";
      b.textContent = p;
      el.appendChild(b);
    } else if (p) {
      el.appendChild(document.createTextNode(p));
    }
  });
  container.appendChild(el);
}

function renderIntro() {
  const chosen = shuffle(pairs.slice()).slice(0, 3);
  const grid = document.getElementById("introGrid");
  grid.innerHTML = "";
  chosen.forEach(p => {
    const card = document.createElement("div");
    card.className = "intro-card";
    const img = document.createElement("img");
    img.src = p.img;
    img.alt = p.word;
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = p.word;
    const desc = document.createElement("div");
    desc.className = "desc";
    const text = introData[p.word] || "介紹待補充";
    text.split("\n").forEach(line => renderIntroLine(desc, line));
    card.appendChild(img);
    card.appendChild(name);
    card.appendChild(desc);
    grid.appendChild(card);
  });
}

function endGame(won) {
  gameOver = true;
  stopTimer();
  clearSelection();
  const box = document.getElementById("resultBox");
  box.classList.toggle("fail", !won);
  document.getElementById("resultTitle").textContent = won ? "恭喜過關!" : "遊戲結束";
  document.getElementById("failMsg").style.display = won ? "none" : "block";
  document.getElementById("rTime").textContent = formatTime(Date.now() - startTime);
  document.getElementById("rAttempts").textContent = attempts;
  document.getElementById("rMistakes").textContent = mistakes;
  renderIntro();
  document.getElementById("resultPanel").classList.add("show");
}

function clearSelection() {
  if (selected) {
    selected.card.classList.remove("selected");
    selected = null;
  }
}

function checkWin() {
  if (matched.size === pairs.length) {
    endGame(true);
  }
}

function flashWrong(cards) {
  cards.forEach(c => {
    c.classList.add("wrong");
    setTimeout(() => c.classList.remove("wrong"), 450);
  });
}

function isImgMatched(img) {
  return matched.has(pairs.find(p => p.img === img).word);
}

function attemptMatch(sel, clickedKey, clickedCard) {
  let w, img;
  if (sel.type === "word") { w = sel.key; img = clickedKey; }
  else { img = sel.key; w = clickedKey; }
  const isMatch = pairs.find(p => p.word === w).img === img;
  attempts++;
  sel.card.classList.remove("selected");
  if (isMatch) {
    sel.card.classList.add("matched", "locked");
    clickedCard.classList.add("matched", "locked");
    matched.add(w);
  } else {
    mistakes++;
    flashWrong([clickedCard, sel.card]);
  }
  selected = null;
  updateStats();
  if (mistakes >= MAX_MISTAKES) {
    endGame(false);
    return;
  }
  checkWin();
}

function buildGame() {
  matched.clear();
  attempts = 0; mistakes = 0;
  gameOver = false;
  timerRunning = false;
  clearInterval(timerInterval);
  clearSelection();
  document.getElementById("timer").textContent = "00:00";
  updateStats();

  const wordBoard = document.getElementById("wordBoard");
  const photoBoard = document.getElementById("photoBoard");
  wordBoard.innerHTML = "";
  photoBoard.innerHTML = "";

  const words = shuffle(pairs.map(p => p.word));
  const photos = shuffle(pairs.map(p => p.img));

  words.forEach(w => {
    const card = document.createElement("div");
    card.className = "card word-card";
    card.textContent = w;
    card.dataset.word = w;
    card.addEventListener("click", () => {
      if (gameOver) return;
      startTimer();
      if (matched.has(w)) return;
      if (selected) {
        if (selected.type === "photo") {
          attemptMatch(selected, w, card);
          return;
        }
        clearSelection();
      }
      card.classList.add("selected");
      selected = { type: "word", key: w, card };
    });
    wordBoard.appendChild(card);
  });

  photos.forEach(img => {
    const card = document.createElement("div");
    card.className = "card photo-card";
    const imgEl = document.createElement("img");
    imgEl.src = img;
    imgEl.draggable = false;
    imgEl.alt = pairs.find(p => p.img === img) ? pairs.find(p => p.img === img).word : "照片";
    card.appendChild(imgEl);
    card.dataset.img = img;
    card.addEventListener("click", () => {
      if (gameOver) return;
      startTimer();
      if (isImgMatched(img)) return;
      if (selected) {
        if (selected.type === "word") {
          attemptMatch(selected, img, card);
          return;
        }
        clearSelection();
      }
      card.classList.add("selected");
      selected = { type: "photo", key: img, card };
    });
    photoBoard.appendChild(card);
  });
}

document.getElementById("restartBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").classList.remove("show");
  document.getElementById("resultBox").classList.remove("fail");
  buildGame();
});

buildGame();
</script>
